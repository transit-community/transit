name: Installer smoke

# Exercises the one-line installers against the NEWEST PUBLISHED RELEASE on
# each OS in dry-run mode: resolve the version from the GitHub API, pick the
# right asset from SHA256SUMS.txt, download it, verify the checksum, stop
# before installing. Catches a renamed asset, a broken sums file, or a
# script regression before a user does. Manual, plus weekly.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC

permissions:
  contents: read

jobs:
  posix:
    name: install.sh (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-apt, os: ubuntu-24.04, pm: apt }
          - { name: ubuntu-aarch64-apt, os: ubuntu-24.04-arm, pm: apt }
          - { name: ubuntu-appimage, os: ubuntu-24.04, pm: appimage }
          - { name: ubuntu-pacman-pkgbuild, os: ubuntu-24.04, pm: pacman }
          - { name: macos-aarch64, os: macos-15, pm: macos }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dry run
        env:
          TRANSIT_FORCE_PM: ${{ matrix.pm }}
        run: sh install.sh --dry-run -y

  windows:
    name: install.ps1 (windows)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dry run
        shell: pwsh
        run: ./install.ps1 -DryRun -Yes

  # Real installs on disposable runners: run the installer for real, then
  # check what it left behind and that a second run detects the install.
  full-install:
    name: full install (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-apt, os: ubuntu-24.04, pm: apt }
          - { name: ubuntu-appimage, os: ubuntu-24.04, pm: appimage }
          - { name: macos-aarch64, os: macos-15, pm: macos }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install for real
        env:
          TRANSIT_FORCE_PM: ${{ matrix.pm }}
        run: sh install.sh -y
      - name: verify the install
        env:
          TRANSIT_FORCE_PM: ${{ matrix.pm }}
        run: |
          set -eu
          latest=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/transit-community/transit/releases/latest | sed 's|.*/tag/v||')
          case "$TRANSIT_FORCE_PM" in
            apt)
              dpkg-query -W -f='${Package} ${Version}\n' transit-community-edition
              test "$(dpkg-query -W -f='${Version}' transit-community-edition)" = "$latest"
              test -x /usr/bin/transit_app
              test -f "/usr/share/applications/Transit Community Edition.desktop"
              ;;
            appimage)
              test -x "$HOME/.local/bin/transit-community"
              test -f "$HOME/.local/share/applications/transit-community.desktop"
              test "$(cat "$HOME/.local/share/transit-community/version")" = "$latest"
              grep -q '^Exec=' "$HOME/.local/share/applications/transit-community.desktop"
              ;;
            macos)
              app=""
              for d in /Applications "$HOME/Applications"; do [ -d "$d/Transit Community Edition.app" ] && app="$d/Transit Community Edition.app"; done
              test -n "$app"
              test "$(defaults read "$app/Contents/Info" CFBundleShortVersionString)" = "$latest"
              # Quarantine flag must be gone or the unsigned app is blocked on launch.
              ! xattr -p com.apple.quarantine "$app" >/dev/null 2>&1
              test -x "$app/Contents/MacOS/transit_app"
              ;;
          esac
      - name: second run reports reinstall
        env:
          TRANSIT_FORCE_PM: ${{ matrix.pm }}
        run: sh install.sh --dry-run -y | tee out.txt; grep -q 'Action     reinstall' out.txt

  full-install-windows:
    name: full install (windows)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install for real
        shell: pwsh
        run: ./install.ps1 -Yes
      - name: verify the install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $k = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
               Where-Object { $_.DisplayName -eq "Transit Community Edition" } | Select-Object -First 1
          if (-not $k) { throw "no per-user uninstall entry for Transit Community Edition" }
          "registered version: $($k.DisplayVersion) at $($k.InstallLocation)"
          # NSIS writes InstallLocation with literal surrounding quotes.
          $loc = ([string]$k.InstallLocation).Trim('"')
          $exe = Join-Path $loc "transit_app.exe"
          if (-not (Test-Path $exe)) { throw "transit_app.exe not found at $exe" }
          $latest = ((Invoke-WebRequest -Uri "https://github.com/transit-community/transit/releases/latest" -MaximumRedirection 5 -UseBasicParsing).BaseResponse.RequestMessage.RequestUri.AbsoluteUri) -replace '.*/tag/v', ''
          if ($k.DisplayVersion -ne $latest) { throw "installed $($k.DisplayVersion) but latest is $latest" }
      - name: second run reports reinstall
        shell: pwsh
        run: |
          # The installer reports through Write-Host (the information
          # stream), which a plain pipeline does not capture; merge all
          # streams so the plan text is inspectable.
          $out = ./install.ps1 -DryRun -Yes *>&1 | Out-String
          $out
          if ($out -notmatch 'Action\s+reinstall') { throw "second run did not detect the existing install" }
