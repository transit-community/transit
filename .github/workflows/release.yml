name: Release

# Tag-triggered, UNSIGNED builds published to GitHub Releases. There is
# no code-signing identity, no notarization, no update manifest and no
# download host in this edition — by decision (see docs/design/
# 2026-09-19-community-edition-plan.md §10). Users verify the
# SHA256SUMS.txt and, on macOS, clear the quarantine bit (README).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Version + changelog asserts
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - id: v
        name: Tag must equal tauri.conf.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$tag" != "$conf" ]]; then
            echo "tag v$tag != tauri.conf.json $conf" >&2; exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Changelog section must exist and be non-empty
        run: node scripts/extract-changelog.mjs "${GITHUB_REF_NAME#v}" > release-notes.md && test -s release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-aarch64, os: macos-15, target: aarch64-apple-darwin, bundles: "dmg" }
          - { name: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin, bundles: "dmg" }
          - {
              name: windows-x86_64,
              os: windows-2025,
              target: x86_64-pc-windows-msvc,
              bundles: "nsis,msi",
            }
          - {
              name: linux-x86_64,
              os: ubuntu-24.04,
              target: x86_64-unknown-linux-gnu,
              bundles: "deb,rpm,appimage",
            }
          - {
              name: linux-aarch64,
              os: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-gnu,
              bundles: "deb,rpm,appimage",
            }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system deps
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libdbus-1-dev patchelf rpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: tauri build (unsigned)
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: no-phone-home scan (this leg's binary)
        shell: bash
        run: |
          bin="src-tauri/target/${{ matrix.target }}/release/transit_app"
          [[ -f "$bin" ]] || bin="$bin.exe"
          ./scripts/no-phone-home-scan.sh "$bin"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: bundle-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6
        with:
          path: dist
      - name: Flatten + checksums
        run: |
          mkdir -p release
          find dist -type f -not -path 'dist/release-notes/*' -exec cp {} release/ \;
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          name: v${{ needs.prepare.outputs.version }}
          body_path: dist/release-notes/release-notes.md
          files: release/*
          fail_on_unmatched_files: true
