# Dependabot — monthly version updates for the three ecosystems. Minor +
# patch updates are grouped into a single PR per ecosystem; MAJOR updates
# open as individual PRs so one un-adoptable major cannot turn a whole
# group red. Pairs with the SHA-pin policy in CLAUDE.md
# §13: the github-actions ecosystem bumps our SHA-pinned actions to the
# latest signed tags. No auto-merge — CI is the build-breakage safety
# net; a maintainer's manual smoke (connect to a device, ask the agent a
# question) is the runtime-behavior safety net.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(actions)"
    open-pull-requests-limit: 5
    groups:
      github-actions-all:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      cargo-all:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    ignore:
      # age 0.12 pulls ml-kem ^0.2 → kem ^0.3.0-pre.0, which resolves to
      # kem 0.3.0 final and does not compile (found Oct 2026). Lift when
      # age's ml-kem dependency reaches 0.3.
      - dependency-name: "age"
        versions: [">= 0.12"]
      # keyring 4 is a redesign: the API moved to keyring-core and every
      # platform store (apple-native, windows-native, linux-native) into a
      # crate of its own, so the feature names transit_auth selects no longer
      # exist. The resolver conflict aborts Dependabot's whole cargo job
      # (2026-10-27). Lift when transit_auth is ported to the keyring-core +
      # per-store layout.
      - dependency-name: "keyring"
        versions: [">= 4"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      npm-all:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    ignore:
      # react-resizable-panels v3/v4 rewrote the Panel/Group API; the
      # migration (six call sites) is a deliberate follow-up, not a chore.
      - dependency-name: "react-resizable-panels"
        update-types: ["version-update:semver-major"]
      # react-doctor 0.5.x is far stricter than 0.1.x and fails the CI
      # gate on current source; adopting it is a tracked follow-up.
      - dependency-name: "react-doctor"
        versions: [">= 0.2"]
      # TypeScript 6→7 is blocked upstream: typescript-eslint still peers
      # `typescript <6.1.0`, so the bump fails `npm ci` with ERESOLVE.
      # Lift once `npm view typescript-eslint peerDependencies` admits 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
